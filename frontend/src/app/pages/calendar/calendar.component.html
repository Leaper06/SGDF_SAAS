<div class="w-[390px] h-[844px] bg-gray-50 relative overflow-hidden shadow-2xl flex flex-col mx-auto">
    
    <div class="bg-white pt-12 pb-4 px-6 shadow-sm z-10 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-extrabold text-gray-900">Calendrier</h1>
            <p class="text-gray-500 text-sm font-medium">Gestion de la maîtrise</p>
        </div>
        <button class="p-2 bg-gray-100 rounded-full text-gray-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 01-.293.707L12 11.414V15a1 1 0 01-.293.707l-2 2A1 1 0 018 17v-5.586L3.293 6.707A1 1 0 013 6V3z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>

    <div class="flex-1 overflow-y-auto bg-gray-50 p-4 space-y-4">
        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">À venir prochainement</h2>

        <div *ngIf="loading" class="text-center p-4 text-sm text-gray-500">Chargement des événements...</div>
        <div *ngIf="errorMessage" class="text-center p-4 text-sm text-red-500 bg-red-50 rounded-xl">{{ errorMessage }}</div>
        <div *ngIf="!loading && campsList.length === 0" class="text-center p-4 text-sm text-gray-400">Aucun week-end de prévu pour le moment.</div>

        <div *ngFor="let camp of campsList" class="bg-white rounded-xl shadow-md border-l-4 border-scoutViolet p-4 flex flex-col gap-3">
            <div class="flex gap-4 items-center">
                <div class="bg-violet-50 text-scoutViolet rounded-lg p-2 text-center min-w-[4rem] border border-violet-100">
                    <span class="block text-[10px] font-bold uppercase">{{ camp.start_date | date:'EEE':'':'fr' }}</span>
                    <span class="block text-base font-black">{{ camp.start_date | date:'dd' }}</span>
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-gray-900 text-base">{{ camp.name }}</h3>
                    <p class="text-xs text-gray-500 mt-0.5" *ngIf="camp.location">
                        <span class="font-medium">Lieu :</span> {{ camp.location }}
                    </p>
                </div>
            </div>
            
            <div class="mt-1 border-t border-gray-100 pt-3">
                <button class="w-full bg-scoutViolet hover:bg-violet-800 text-white text-sm font-semibold py-2.5 rounded-lg flex justify-center items-center gap-2 transition-colors">
                    Gérer le week-end
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <button class="absolute bottom-6 right-6 w-14 h-14 bg-scoutOrange text-white rounded-full shadow-lg shadow-orange-500/40 flex items-center justify-center hover:bg-orange-600 transition-transform transform active:scale-95 z-20">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
    </button>
</div>
