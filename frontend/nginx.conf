# ==========================================
# 1. POLYMAITRISE (SaaS existant)
# ==========================================
server {
    listen 80;
    server_name polymaitrise.fr www.polymaitrise.fr;

    # Validation Let's Encrypt (renouvellement automatique des certificats par certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name polymaitrise.fr www.polymaitrise.fr;

    ssl_certificate /etc/letsencrypt/live/polymaitrise.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polymaitrise.fr/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Résolution DNS dynamique de l'API via le DNS interne de Docker :
    # si le conteneur API redémarre et change d'IP, Nginx suit automatiquement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:5000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# ==========================================
# 2. PICONTEUR (PWA Mobile sur port 3000)
# ==========================================
server {
    listen 80;
    server_name piconteur.polymaitrise.fr;

    # Validation Let's Encrypt (renouvellement automatique des certificats par certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name piconteur.polymaitrise.fr;

    ssl_certificate /etc/letsencrypt/live/piconteur.polymaitrise.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/piconteur.polymaitrise.fr/privkey.pem;

    location / {
        proxy_pass http://172.17.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
