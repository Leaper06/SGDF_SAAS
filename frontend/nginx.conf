# Le videur : Redirection forcée de HTTP vers HTTPS
server {
    listen 80;
    server_name polymaitrise.fr;
    return 301 https://$host$request_uri;
}

# Le serveur sécurisé
server {
    listen 443 ssl;
    server_name polymaitrise.fr;

    # Emplacement des certificats générés par Certbot
    ssl_certificate /etc/letsencrypt/live/polymaitrise.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polymaitrise.fr/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://api:5000/uploads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}