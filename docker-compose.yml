services:
  # 1. Le Backend (Ton API Python/Flask)
  api:
    build: 
      context: ./backend
    container_name: polymaitrise_api
    ports:
      - "127.0.0.1:5000:5000" # Accessible uniquement depuis la machine (Nginx passe par le réseau Docker)
    env_file:
      - .env        # Injecte automatiquement tes clés Supabase
    # Fichiers uploadés (fiches sanitaires) et données locales : conservés entre deux déploiements
    volumes:
      - api_uploads:/app/app/uploads
      - api_data:/app/app/data
    restart: unless-stopped # Le serveur redémarre tout seul si le PC redémarre
    # Vérifie toutes les 30 s que l'API répond. Après 3 échecs, elle passe "unhealthy"
    # et le service autoheal la redémarre (cas d'une API figée qui ne crashe pas).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
    networks:
      - scout-network

  # 2. Le Frontend (Ton interface Vue.js servie par Nginx)
  frontend:
    build: 
      context: ./frontend
    container_name: polymaitrise_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro # Fichiers de validation Let's Encrypt (certbot --webroot)
    depends_on:
      - api         # On s'assure que l'API démarre en premier
    restart: unless-stopped
    networks:
      - scout-network

  # 3. Le Médecin : redémarre automatiquement les conteneurs "unhealthy" portant le label autoheal=true
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: polymaitrise_autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

# On crée un petit réseau virtuel fermé pour que les conteneurs communiquent entre eux
networks:
  scout-network:
    driver: bridge

# Volumes persistants (survivent à la reconstruction des conteneurs)
volumes:
  api_uploads:
  api_data:
