<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquette Fiche Activité PolyMaîtrise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        scoutViolet: '#5b2b82', 
                        scoutOrange: '#e45a27',
                        bgLight: '#f8fafc'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-300 flex justify-center p-10 font-sans">

    <div class="w-[390px] h-[844px] bg-bgLight relative overflow-hidden shadow-2xl flex flex-col">
        
        <div class="bg-white px-4 py-4 shadow-sm z-20 flex justify-between items-center sticky top-0">
            <button class="text-gray-500 hover:text-gray-800 flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                <span class="text-sm font-medium">Planning</span>
            </button>
            
            <div class="flex gap-2">
                <span class="bg-orange-100 text-scoutOrange text-[10px] font-bold px-2 py-1 rounded-md uppercase">Jeu</span>
                <span class="bg-gray-100 text-gray-600 text-[10px] font-bold px-2 py-1 rounded-md uppercase">2h30</span>
            </div>
            
            <button class="text-scoutViolet font-bold text-sm">
                Enregistrer
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-6">
            
            <div>
                <input type="text" value="Grand Jeu de Piste" class="w-full text-3xl font-extrabold text-gray-900 bg-transparent border-none focus:ring-0 p-0 placeholder-gray-300" placeholder="Titre de l'activité...">
                
                <div class="flex items-center gap-2 mt-3 text-sm text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <span>Resp : </span>
                    <span class="bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full text-xs font-medium">Alice</span>
                    <span class="bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full text-xs font-medium">Jean</span>
                    <button class="text-gray-400 hover:text-scoutViolet">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                <div class="flex items-center gap-2 mb-3 text-scoutViolet border-b border-gray-50 pb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    <h3 class="font-bold text-gray-800">Imaginaire & Objectifs</h3>
                </div>
                <textarea rows="3" class="w-full text-sm text-gray-600 bg-transparent border-none focus:ring-0 p-0 resize-none placeholder-gray-400" placeholder="Il était une fois... Quel est le but scout de ce jeu ?">Les jeunes sont des explorateurs perdus sur Mars. L'objectif est la cohésion d'équipe et l'apprentissage de l'orientation à la boussole.</textarea>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                <div class="flex items-center justify-between mb-4 text-gray-800 border-b border-gray-50 pb-2">
                    <div class="flex items-center gap-2 text-scoutOrange">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <h3 class="font-bold text-gray-800">Le Déroulé</h3>
                    </div>
                </div>

                <div class="relative border-l-2 border-orange-200 ml-2 space-y-6 pb-2">
                    <div class="relative pl-6">
                        <div class="absolute w-3 h-3 bg-scoutOrange rounded-full -left-[7px] top-1.5 border-2 border-white"></div>
                        <div class="flex items-baseline gap-2">
                            <span class="text-sm font-bold text-gray-900">15:00</span>
                            <span class="text-xs text-gray-400">(15 min)</span>
                        </div>
                        <p class="text-sm text-gray-600 mt-1 font-medium">Lancement de l'imaginaire</p>
                        <p class="text-xs text-gray-500 mt-0.5">Distribution des rôles par Alice.</p>
                    </div>

                    <div class="relative pl-6">
                        <div class="absolute w-3 h-3 bg-scoutOrange rounded-full -left-[7px] top-1.5 border-2 border-white"></div>
                        <div class="flex items-baseline gap-2">
                            <span class="text-sm font-bold text-gray-900">15:15</span>
                            <span class="text-xs text-gray-400">(1h30)</span>
                        </div>
                        <p class="text-sm text-gray-600 mt-1 font-medium">Parcours d'orientation</p>
                        <p class="text-xs text-gray-500 mt-0.5">3 balises à trouver dans la forêt.</p>
                    </div>

                    <div class="relative pl-6 pt-2">
                        <div class="absolute w-3 h-3 bg-gray-200 rounded-full -left-[7px] top-3.5 border-2 border-white"></div>
                        <button class="text-xs font-semibold text-scoutOrange bg-orange-50 px-3 py-1.5 rounded-lg flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                            Ajouter une étape
                        </button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-8">
                <div class="flex items-center justify-between mb-3 text-gray-800 border-b border-gray-50 pb-2">
                    <div class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                        </svg>
                        <h3 class="font-bold text-gray-800">Matériel</h3>
                    </div>
                </div>
                
                <ul class="space-y-2 text-sm text-gray-600">
                    <li class="flex items-center gap-2">
                        <input type="checkbox" class="rounded text-scoutViolet border-gray-300 focus:ring-scoutViolet h-4 w-4">
                        <span>4 Boussoles</span>
                    </li>
                    <li class="flex items-center gap-2">
                        <input type="checkbox" class="rounded text-scoutViolet border-gray-300 focus:ring-scoutViolet h-4 w-4">
                        <span>Ficelle (1 pelote)</span>
                    </li>
                    <li class="flex items-center gap-2">
                        <input type="checkbox" class="rounded text-scoutViolet border-gray-300 focus:ring-scoutViolet h-4 w-4">
                        <span>Maquillage</span>
                    </li>
                </ul>

                <div class="mt-4 flex gap-2">
                    <input type="text" placeholder="Ajouter un objet..." class="flex-1 text-sm border border-gray-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-scoutViolet">
                    <button class="bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg hover:bg-gray-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                    </button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
