<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquette Calendrier PolyMaîtrise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        scoutViolet: '#5b2b82', 
                        scoutOrange: '#e45a27'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-300 flex justify-center p-10 font-sans">

    <div class="w-[390px] h-[844px] bg-gray-50 relative overflow-hidden shadow-2xl flex flex-col">
        
        <div class="bg-white pt-12 pb-4 px-6 shadow-sm z-10 flex justify-between items-center">

            </div>
            <button class="p-2 bg-gray-100 rounded-full text-gray-600">

                </svg>
            </button>
        </div>

            <div class="grid grid-cols-7 text-center mb-2">

                <div class="text-xs font-bold text-gray-400">M</div>
                <div class="text-xs font-bold text-gray-400">M</div>
                <div class="text-xs font-bold text-gray-400">J</div>
                <div class="text-xs font-bold text-gray-400">V</div>
                <div class="text-xs font-bold text-gray-400">S</div>
                <div class="text-xs font-bold text-gray-400">D</div>
            </div>
            
            <div class="grid grid-cols-7 gap-y-4 text-center text-sm font-medium text-gray-700">
                
                <div class="py-1 text-gray-300">28</div>
                <div class="py-1 text-gray-300">29</div>
                <div class="py-1 text-gray-300">30</div>
                <div class="py-1">1</div>
                <div class="py-1">2</div>
                <div class="py-1">3</div>
                <div class="py-1">4</div>

                <div class="py-1">5</div>
                <div class="py-1">6</div>
                <div class="py-1 relative">
                    7
                    <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-1.5 h-1.5 bg-gray-600 rounded-full"></div>
                </div>
                <div class="py-1">8</div>
                <div class="py-1">9</div>
                <div class="py-1">10</div>
                <div class="py-1">11</div>

                <div class="py-1">12</div>
                <div class="py-1">13</div>
                <div class="py-1">14</div>
                <div class="py-1">15</div>
                <div class="py-1">16</div>
                <div class="bg-scoutViolet text-white py-1 rounded-l-full relative z-10">17</div>
                <div class="bg-scoutViolet text-white py-1 rounded-r-full relative z-10">18</div>

                <div class="py-1">19</div>
                <div class="py-1">20</div>
                <div class="py-1">21</div>
                <div class="py-1">22</div>
                <div class="py-1">23</div>
                <div class="py-1">24</div>
                <div class="py-1">25</div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto bg-gray-50 p-4 space-y-4">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">À venir ce mois-ci</h2>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex gap-4 items-center">
                <div class="bg-gray-100 text-gray-600 rounded-lg p-3 text-center min-w-[3.5rem]">
                    <span class="block text-xs font-bold uppercase">Mer</span>
                    <span class="block text-lg font-black">07</span>
                </div>
                <div class="flex-1">
                    <h3 class="font-bold text-gray-900 text-sm">Réunion de Maîtrise</h3>
                    <p class="text-xs text-gray-500 mt-0.5">20h00 - Local scout</p>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md border-l-4 border-scoutViolet p-4 flex flex-col gap-3">
                <div class="flex gap-4 items-center">
                    <div class="bg-violet-50 text-scoutViolet rounded-lg p-2 text-center min-w-[4rem] border border-violet-100">
                        <span class="block text-[10px] font-bold uppercase">Sam-Dim</span>
                        <span class="block text-base font-black">17-18</span>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-900 text-base">WE de rentrée</h3>
                        <p class="text-xs text-gray-500 mt-0.5">Base de la Guiche</p>
                    </div>
                </div>
                
                <div class="mt-1 border-t border-gray-100 pt-3">

                        Gérer le week-end
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                          <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>

        </div>

        <button class="absolute bottom-6 right-6 w-14 h-14 bg-scoutOrange text-white rounded-full shadow-lg shadow-orange-500/40 flex items-center justify-center hover:bg-orange-600 transition-transform transform active:scale-95 z-20">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
        </button>

    </div>

</body>
</html>
